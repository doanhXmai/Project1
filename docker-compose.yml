version: "3.9"

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fastapi_dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # mount code vào container
      - /app/__pycache__/  # tránh lỗi cache
    environment:
      - ENV=development
    restart: unless-stopped
